<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ClaudeSteroids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="ClaudeSteroids game"></canvas>
    <div id="scanlines"></div>
  </div>

  <div id="touch" aria-hidden="true">
    <div class="cluster">
      <button data-k="left">&#9664;</button>
      <button data-k="right">&#9654;</button>
    </div>
    <button id="touch-pause" data-k="pause">II</button>
    <div class="cluster">
      <button data-k="hyper" class="small">&#8644;</button>
      <button data-k="thrust">&#9650;</button>
      <button data-k="fire" class="fire">&#9679;</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
